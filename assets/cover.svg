<text x="67" y="430" font-family="Arial,sans-serif" font-size="19" fill="#53675c">Choose what to learn. See what you can afford.</text><text x="67" y="458" font-family="Arial,sans-serif" font-size="19" fill="#53675c">Keep room to change your mind.</text>
