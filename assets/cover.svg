<path d="M807 191V438" stroke="#b8cbaa" stroke-width="2"/>
<g font-family="Georgia,serif" fill="#203c34"><circle cx="807" cy="195" r="11" fill="#e6eddf" stroke="#759565"/><text x="836" y="203" font-size="26">Explore a possibility</text><circle cx="807" cy="270" r="11" fill="#e6eddf" stroke="#759565"/><text x="836" y="278" font-size="26">Test it in the real world</text><circle cx="807" cy="345" r="11" fill="#e6eddf" stroke="#759565"/><text x="836" y="353" font-size="26">Build earning ability</text><circle cx="807" cy="420" r="11" fill="#245a43"/><text x="836" y="428" font-size="26">Grow your resilience</text></g>
<g font-family="Arial,sans-serif" font-size="12" fill="#66736b"><text x="836" y="224">What could work, and for whom?</text><text x="836" y="299">What can a small experiment prove?</text><text x="836" y="374">Who pays for work you can deliver?</text><text x="836" y="449">What gives you more room to adapt?</text></g><path d="M789 474H1176" stroke="#e0e5da"/><text x="792" y="501" font-family="Arial,sans-serif" font-size="12" fill="#66736b">A better process. No guaranteed outcomes.</text>
