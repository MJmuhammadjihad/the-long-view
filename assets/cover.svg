<rect x="64" y="136" width="222" height="29" rx="14" fill="#e4ecdc"/><text x="82" y="155" font-family="Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#245a43">OPEN SOURCE · LOCAL FIRST</text>
